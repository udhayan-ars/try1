<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shinchan Secure Login</title>
  <style>
    body {
      margin: 0;
      background: black;
      font-family: monospace;
      color: #00ff00;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
    }

    .login-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85);
      padding: 30px;
      border: 1px solid #00ff00;
      box-shadow: 0 0 20px #00ff00;
      text-align: center;
      width: 320px;
    }

    input {
      display: block;
      margin: 10px auto;
      padding: 10px;
      width: 220px;
      background: black;
      border: 1px solid #00ff00;
      color: #00ff00;
      outline: none;
    }

    button {
      padding: 10px 20px;
      background: black;
      border: 1px solid #ff0000;
      color: #ff0000;
      cursor: pointer;
      box-shadow: 0 0 10px #ff0000;
    }

    h2 {
      color: #00ff00;
      text-shadow: 0 0 10px #00ff00;
    }

    .message {
      margin-top: 20px;
      color: #ff0000;
      min-height: 20px;
    }
  </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="login-box">
  <h2>Hacker Login</h2>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Access</button>
  <div class="message" id="msg"></div>
</div>

<script>
  // Matrix Effect
  const canvas = document.getElementById("matrix");
  const ctx = canvas.getContext("2d");

  function resizeCanvas() {
    canvas.height = window.innerHeight;
    canvas.width = window.innerWidth;
  }
  resizeCanvas();

  const letters = "01";
  const fontSize = 14;
  let columns = Math.floor(canvas.width / fontSize);
  let drops = [];

  function resetDrops() {
    columns = Math.floor(canvas.width / fontSize);
    drops = [];
    for (let x = 0; x < columns; x++) drops[x] = 1;
  }
  resetDrops();

  window.addEventListener("resize", () => {
    resizeCanvas();
    resetDrops();
  });

  function draw() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#0f0";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
      const text = letters.charAt(Math.floor(Math.random() * letters.length));
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);

      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }

      drops[i]++;
    }
  }

  setInterval(draw, 33);

  // -----------------------------
  // Custom password logic
  // -----------------------------
  function generatePassword() {
    const baseText = "na subscribe selfie blogs";
    const nameKey = "Udhayan";

    const now = new Date();
    const hour = now.getHours();
    const minute = now.getMinutes();

    // Current time numeric value
    const currentTimeValue = hour * 60 + minute;

    // Udhayan name multiplier
    let nameMultiplier = 0;
    for (let i = 0; i < nameKey.length; i++) {
      nameMultiplier += nameKey.charCodeAt(i);
    }

    let transformed = "";

    for (let i = 0; i < baseText.length; i++) {
      let code = baseText.charCodeAt(i);

      // shift +255
      code = code + 255;

      // add current time
      code = code + currentTimeValue;

      // multiply using Udhayan value
      code = code * nameMultiplier;

      // reduce current time
      code = code - currentTimeValue;

      // safe printable range conversion
      code = 33 + (code % 94);

      transformed += String.fromCharCode(code);
    }

    // final password with time suffix
    const timePart =
      String(hour).padStart(2, "0") +
      String(minute).padStart(2, "0");

    return transformed.slice(0, 10) + timePart;
  }

  function login() {
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value;
    const msg = document.getElementById("msg");

    const correctUser = "shinchan";
    const correctPass = generatePassword();

    if (user === correctUser && pass === correctPass) {
      document.body.innerHTML = `
        <div style="color:#00ff00; text-align:center; margin-top:20%; font-size:24px; text-shadow:0 0 10px #00ff00;">
          🎉 ACCESS GRANTED 🎉<br><br>
          Congratulations! You will find the solution 💻
        </div>
      `;
    } else {
      msg.innerText = "Access Denied!";
    }
  }

  // Enter key support
  document.getElementById("password").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      login();
    }
  });

  // Optional: show current generated password in console for testing
  console.log("Generated Password:", generatePassword());
</script>

</body>
</html>
